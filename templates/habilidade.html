<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habilidades - Supremacia do Protesto</title>
    <link rel="stylesheet" href="../statics/css/global.css" />
    <link rel="stylesheet" href="../statics/css/global_modals.css" />
    <link rel="stylesheet" href="../statics/css/menu.css" />
    <link rel="stylesheet" href="../statics/css/inventario/inventario.css" />
    <link rel="stylesheet" href="../statics/css/habilidades/habilidades.css" />
    <link rel="stylesheet" href="../statics/css/responsive.css" />
    <link rel="stylesheet" href="../statics/css/habilidades/habilidades_responsive.css" />
    <link rel="stylesheet" href="../statics/css/design_system.css" />
    <script src="../statics/js/responsive.js"></script>
    <script src="../statics/js/global.js"></script>
    <script src="../statics/js/global_calculations.js"></script>
    <script src="../statics/js/global_ui.js"></script>
    <script src="../statics/js/global_data.js"></script>
    <script src="../statics/js/global_images.js"></script>
    <script src="../statics/js/global_modals.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/global_dragdrop.js"></script>
    <script src="../statics/js/habilidades/habilidades_ui.js"></script>
    <script src="../statics/js/habilidades/modais/habilidades_modais.js"></script>
    <script src="../statics/js/habilidades/habilidades.js"></script>
    <script src="../statics/js/design_system.js"></script>
  </head>
  <body class="page-habilidades">
    <!-- Menu Superior Dinâmico -->
    <nav class="top-menu">
      <div class="menu-links"></div>
    </nav>

    <!-- Global Notification Area -->
    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <main class="container">
      <header class="page-hero ui-reveal">
        <div class="page-hero-copy">
          <span class="page-eyebrow">Repertório do personagem</span>
          <h1>Habilidades</h1>
          <p>Organize técnicas, talentos e reações. Consulte custos e efeitos sem perder o ritmo da sessão.</p>
        </div>
        <div class="page-hero-summary" aria-live="polite">
          <strong id="habilidades-summary-count">0</strong>
          <span>habilidades visíveis</span>
        </div>
      </header>

      <div class="filter-bar page-toolbar ui-reveal" role="search" aria-label="Filtros de habilidades">
        <div class="search-group">
          <input
            type="text"
            id="search-habilidade"
            class="inv-input"
            placeholder="Buscar habilidade pelo nome..."
            aria-label="Buscar habilidade"
            oninput="filtrarHabilidades()"
          />
        </div>
        <select id="filter-habilidade-tipo" class="inv-input toolbar-select" aria-label="Filtrar por tipo" onchange="filtrarHabilidades()">
          <option value="todos">Todos os Tipos</option>
          <option value="Ativa">Ativa</option>
          <option value="Passiva">Passiva</option>
          <option value="Reação">Reação</option>
          <option value="Outro">Outro</option>
        </select>
        <select id="filter-habilidade-classe" class="inv-input toolbar-select" aria-label="Filtrar por origem" onchange="filtrarHabilidades()">
          <option value="todos">Todas as Fontes</option>
          <!-- Preenchido via JS -->
        </select>
        <button type="button" class="btn-open-desc toolbar-reset" onclick="resetarFiltrosHabilidades()" title="Limpar filtros">Limpar</button>
      </div>

      <section class="collection-panel ui-reveal" aria-labelledby="habilidades-list-title">
        <div class="collection-heading">
          <div>
            <span class="page-section-eyebrow">Biblioteca pessoal</span>
            <h2 id="habilidades-list-title">Todas as habilidades</h2>
            <p>Arraste os cards para reorganizar seu repertório.</p>
          </div>
          <strong id="habilidades-counter" class="page-counter">0 habilidades visíveis</strong>
        </div>

        <section id="habilidades-container" class="inventory-list entity-card-grid" aria-live="polite"></section>

        <div class="collection-footer page-actions">
          <button type="button" class="btn-history" onclick="abrirModalHistorico()">Histórico de uso</button>
          <button type="button" class="btn-clear-inventory" onclick="limparHabilidades()">Limpar habilidades</button>
          <button type="button" class="btn-add-card" onclick="adicionarHabilidadeUI()">+ Nova habilidade</button>
        </div>
      </section>
    </main>
  </body>
</html>
