<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poderes - Supremacia do Protesto</title>
    <link rel="stylesheet" href="../statics/css/global.css" />
    <link rel="stylesheet" href="../statics/css/global_modals.css" />
    <link rel="stylesheet" href="../statics/css/menu.css" />
    <link rel="stylesheet" href="../statics/css/inventario/inventario.css" />
    <link rel="stylesheet" href="../statics/css/habilidades/habilidades.css" />
    <link rel="stylesheet" href="../statics/css/poderes/poderes.css" />
    <link rel="stylesheet" href="../statics/css/poderes/poderes_responsive.css" />
    <link rel="stylesheet" href="../statics/css/responsive.css" />
    <link rel="stylesheet" href="../statics/css/design_system.css" />
    <script src="../statics/js/responsive.js"></script>
    <script src="../statics/js/global.js"></script>
    <script src="../statics/js/global_calculations.js"></script>
    <script src="../statics/js/global_ui.js"></script>
    <script src="../statics/js/global_data.js"></script>
    <script src="../statics/js/global_images.js"></script>
    <script src="../statics/js/global_modals.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/global_dragdrop.js"></script>
    <script src="../statics/js/poderes/poderes_ui.js"></script>
    <script src="../statics/js/poderes/modais/poderes_modais.js"></script>
    <script src="../statics/js/poderes/poderes.js"></script>
    <script src="../statics/js/design_system.js"></script>
  </head>
  <body class="page-poderes">
    <nav class="top-menu">
      <div class="menu-links"></div>
    </nav>

    <!-- Global Notification Area -->
    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <main class="container">
      <header class="page-hero ui-reveal">
        <div class="page-hero-copy">
          <span class="page-eyebrow">Manifestação de supremacia</span>
          <h1>Poderes</h1>
          <p>Organize talentos, técnicas e efeitos permanentes do personagem em um só grimório.</p>
        </div>
        <div class="page-hero-summary" aria-live="polite">
          <strong id="poderes-summary-count">0</strong>
          <span>poderes visíveis</span>
        </div>
      </header>

      <div class="filter-bar page-toolbar ui-reveal" role="search" aria-label="Filtros de poderes">
        <div class="search-group">
          <input type="text" id="search-poder" class="inv-input" placeholder="Buscar poder pelo nome..." aria-label="Buscar poder" oninput="filtrarPoderes()" />
        </div>
        <select id="filter-poder-tipo" class="inv-input toolbar-select" aria-label="Filtrar por origem" onchange="filtrarPoderes()">
          <option value="todos">Todos os Tipos</option>
          <option value="Poder de Classe">Classe</option>
          <option value="Poder de Povo">Povo</option>
          <option value="Poder de Raça">Raça</option>
          <option value="Outro">Outro</option>
        </select>
        <button type="button" class="btn-open-desc toolbar-reset" onclick="resetarFiltrosPoderes()" title="Limpar filtros">Limpar</button>
      </div>

      <section class="collection-panel ui-reveal" aria-labelledby="poderes-list-title">
        <div class="collection-heading poderes-list-header">
          <div>
            <span class="page-section-eyebrow poderes-eyebrow">Grimório pessoal</span>
            <h2 id="poderes-list-title">Todos os poderes</h2>
            <p class="poderes-drag-hint">Arraste os cards para reorganizar.</p>
          </div>
          <strong id="poderes-counter" class="page-counter">0 poderes visíveis</strong>
        </div>

        <section id="poderes-container" class="poderes-grid ui-card-grid" aria-live="polite">
          <!-- Injetado via JS -->
        </section>

        <div class="collection-footer page-actions poderes-footer-actions">
          <button type="button" class="btn-clear-inventory" onclick="limparPoderes()">Limpar poderes</button>
          <button type="button" class="btn-add-card" onclick="adicionarPoderUI()">+ Novo poder</button>
        </div>
      </section>
    </main>
  </body>
</html>
