<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poderes - Supremacia do Protesto</title>
    <link rel="stylesheet" href="../statics/css/global.css" />
    <link rel="stylesheet" href="../statics/css/global_modals.css" />
    <link rel="stylesheet" href="../statics/css/menu.css" />
    <link rel="stylesheet" href="../statics/css/inventario/inventario.css" />
    <link rel="stylesheet" href="../statics/css/habilidades/habilidades.css" />
    <link rel="stylesheet" href="../statics/css/poderes/poderes_responsive.css" />
    <link rel="stylesheet" href="../statics/css/responsive.css" />
    <script src="../statics/js/responsive.js"></script>
    <script src="../statics/js/global.js"></script>
    <script src="../statics/js/global_calculations.js"></script>
    <script src="../statics/js/global_ui.js"></script>
    <script src="../statics/js/global_data.js"></script>
    <script src="../statics/js/global_images.js"></script>
    <script src="../statics/js/global_modals.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/inventario/inventario.js"></script>
    <script src="../statics/js/poderes/poderes_ui.js"></script>
    <script src="../statics/js/poderes/modais/poderes_modais.js"></script>
    <script src="../statics/js/poderes/poderes.js"></script>
  </head>
  <body>
    <nav class="top-menu">
      <div class="menu-links"></div>
    </nav>

    <!-- Global Notification Area -->
    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <div class="container">
      <header>
        <h1>PODERES</h1>
      </header>

      <div class="filter-bar">
        <div class="search-group">
          <input type="text" id="search-poder" class="inv-input" placeholder="🔍 Pesquisar poder pelo nome..." oninput="filtrarPoderes()" />
        </div>
        <select id="filter-poder-tipo" class="inv-input" style="max-width: 150px" onchange="filtrarPoderes()">
          <option value="todos">Todos os Tipos</option>
          <option value="Poder de Classe">Classe</option>
          <option value="Poder de Povo">Povo</option>
          <option value="Poder de Raça">Raça</option>
          <option value="Outro">Outro</option>
        </select>
        <button type="button" class="btn-open-desc" onclick="resetarFiltrosPoderes()" title="Limpar Filtros">🔄</button>
      </div>

      <div
        id="poderes-counter"
        style="color: #888; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; padding-left: 5px"
      >
        Poderes visíveis: 0
      </div>

      <div class="inv-header pod-header-grid">
        <span>Nome</span>
        <span>Tipo</span>
        <span>Custo</span>
        <span>Info</span>
        <span>Usar</span>
        <span>Dup</span>
        <span>X</span>
      </div>

      <section id="poderes-container" class="inventory-list">
        <!-- Injetado via JS -->
      </section>

      <button type="button" class="btn-add-card" onclick="adicionarPoderUI()">+ Novo Poder</button>
      <button type="button" class="btn-clear-inventory" onclick="limparPoderes()">Limpar Poderes</button>
    </div>
  </body>
</html>
