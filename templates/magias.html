<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magias - Supremacia do Protesto</title>
    <link rel="stylesheet" href="../statics/css/global.css" />
    <link rel="stylesheet" href="../statics/css/global_modals.css" />
    <link rel="stylesheet" href="../statics/css/menu.css" />
    <link rel="stylesheet" href="../statics/css/inventario/inventario.css" />
    <link rel="stylesheet" href="../statics/css/habilidades/habilidades.css" />
    <link rel="stylesheet" href="../statics/css/magias/magias.css" />
    <link rel="stylesheet" href="../statics/css/magias/magias_responsive.css" />
    <link rel="stylesheet" href="../statics/css/responsive.css" />
    <link rel="stylesheet" href="../statics/css/design_system.css" />
    <script src="../statics/js/responsive.js"></script>
    <script src="../statics/js/global.js"></script>
    <script src="../statics/js/global_calculations.js"></script>
    <script src="../statics/js/global_ui.js"></script>
    <script src="../statics/js/global_data.js"></script>
    <script src="../statics/js/global_images.js"></script>
    <script src="../statics/js/global_modals.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/global_dragdrop.js"></script>
    <script src="../statics/js/magias/magias_data.js"></script>
    <script src="../statics/js/magias/magias_ui.js"></script>
    <script src="../statics/js/magias/modais/magias_modais.js"></script>
    <script src="../statics/js/magias/magias.js"></script>
    <script src="../statics/js/design_system.js"></script>
  </head>
  <body class="page-magias">
    <nav class="top-menu">
      <div class="menu-links"></div>
    </nav>

    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <main class="container">
      <header class="page-hero ui-reveal">
        <div class="page-hero-copy">
          <span class="page-eyebrow">Grimório arcano</span>
          <h1>Magias</h1>
          <p>Catalogue círculos, custos e efeitos persistentes em um grimório rápido de consultar durante o jogo.</p>
        </div>
        <div class="page-hero-summary" aria-live="polite">
          <strong id="magias-summary-count">0</strong>
          <span>magias visíveis</span>
        </div>
      </header>

      <div class="filter-bar page-toolbar ui-reveal" role="search" aria-label="Filtros de magias">
        <div class="search-group">
          <input type="text" id="search-magia" class="inv-input" placeholder="Buscar magia pelo nome..." aria-label="Buscar magia" oninput="filtrarMagias()" />
        </div>
        <select id="filter-magia-tipo" class="inv-input toolbar-select" aria-label="Filtrar por tradição" onchange="filtrarMagias()">
          <option value="todos">Todos os Tipos</option>
          <option value="Comum">Comum</option>
          <option value="Elemental">Elemental</option>
          <option value="Divinas">Divinas</option>
          <option value="Demoniaca">Demoniaca</option>
          <option value="Palavra Sagrada">Palavra Sagrada</option>
          <option value="Outro">Outro</option>
        </select>
        <!-- Chips de círculo substituem o select de nível -->
        <div class="circle-chips" id="circle-chips">
          <button type="button" class="circle-chip active" data-nivel="todos" onclick="setCircleFilter(this, 'todos')">Todos</button>
          <button type="button" class="circle-chip chip-1" data-nivel="1" onclick="setCircleFilter(this, '1')">I</button>
          <button type="button" class="circle-chip chip-2" data-nivel="2" onclick="setCircleFilter(this, '2')">II</button>
          <button type="button" class="circle-chip chip-3" data-nivel="3" onclick="setCircleFilter(this, '3')">III</button>
          <button type="button" class="circle-chip chip-4" data-nivel="4" onclick="setCircleFilter(this, '4')">IV</button>
          <button type="button" class="circle-chip chip-extra" data-nivel="extra" onclick="setCircleFilter(this, 'extra')">+</button>
        </div>
        <!-- select oculto para manter compatibilidade com filtrarMagias() -->
        <select id="filter-magia-nivel" hidden onchange="filtrarMagias()">
          <option value="todos">Todos Níveis</option>
          <option value="1">Círculo I</option>
          <option value="2">Círculo II</option>
          <option value="3">Círculo III</option>
          <option value="4">Círculo IV</option>
          <option value="extra">Outros / %</option>
        </select>
        <button type="button" class="btn-toggle-desc toolbar-reset" onclick="document.body.classList.toggle('show-descriptions')" title="Mostrar/Ocultar descrições">Descrições</button>
        <button type="button" class="btn-open-desc toolbar-reset" onclick="resetarFiltrosMagia()" title="Limpar filtros">Limpar</button>
      </div>

      <section class="collection-panel ui-reveal" aria-labelledby="magias-list-title">
        <div class="collection-heading">
          <div>
            <span class="page-section-eyebrow">Repertório conhecido</span>
            <h2 id="magias-list-title">Todas as magias</h2>
            <p>Arraste os cards para definir a ordem do grimório.</p>
          </div>
          <strong id="magias-counter" class="page-counter">0 magias visíveis</strong>
        </div>

        <section id="magias-container" class="inventory-list entity-card-grid" aria-live="polite"></section>

        <div class="collection-footer page-actions">
          <button type="button" class="btn-history" onclick="abrirModalHistorico()">Histórico de conjuração</button>
          <button type="button" class="btn-clear-inventory" onclick="limparMagias()">Limpar grimório</button>
          <button type="button" class="btn-add-card" onclick="adicionarMagiaUI()">+ Aprender magia</button>
        </div>
      </section>
    </main>
  </body>
</html>
