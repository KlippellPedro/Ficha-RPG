<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magias - Supremacia do Protesto</title>
    <link rel="stylesheet" href="../../statics/css/global.css" />
    <link rel="stylesheet" href="../../statics/css/menu.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/inventario.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/habilidades.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/magias.css" />
    <script src="../../statics/js/global.js"></script>
    <script src="../../statics/js/menu.js"></script>
    <script src="../../statics/js/fichas/magias.js"></script>
  </head>
  <body>
    <nav class="top-menu">
      <div class="menu-links"></div>
    </nav>

    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <div class="container">
      <header>
        <h1>MAGIAS</h1>
      </header>

      <div class="filter-bar">
        <div class="search-group">
          <input type="text" id="search-magia" class="inv-input" placeholder="🔍 Pesquisar magia pelo nome..." oninput="filtrarMagias()" />
        </div>
        <select id="filter-magia-tipo" class="inv-input" style="max-width: 150px" onchange="filtrarMagias()">
          <option value="todos">Todos os Tipos</option>
          <option value="Comum">Comum</option>
          <option value="Elemental">Elemental</option>
          <option value="Divinas">Divinas</option>
          <option value="Demoniaca">Demoniaca</option>
          <option value="Palavra Sagrada">Palavra Sagrada</option>
          <option value="Outro">Outro</option>
        </select>
        <select id="filter-magia-nivel" class="inv-input" style="max-width: 120px" onchange="filtrarMagias()">
          <option value="todos">Todos Níveis</option>
          <option value="1">Círculo I</option>
          <option value="2">Círculo II</option>
          <option value="3">Círculo III</option>
          <option value="4">Círculo IV</option>
          <option value="extra">Outros / %</option>
        </select>
        <button type="button" class="btn-open-desc" onclick="resetarFiltrosMagia()" title="Limpar Filtros">🔄</button>
      </div>

      <div
        id="magias-counter"
        style="color: #888; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; padding-left: 5px"
      >
        Magias visíveis: 0
      </div>

      <div class="inv-header mag-header-grid">
        <span>Nome</span>
        <span>Tipo de Magia</span>
        <span>Nível</span>
        <span>Custo</span>
        <span>Info</span>
        <span>Usar</span>
        <span>Dup</span>
        <span>X</span>
      </div>

      <section id="magias-container" class="inventory-list">
        <!-- Injetado via JS -->
      </section>

      <button type="button" class="btn-add-card" onclick="adicionarMagiaUI()">+ Aprender Nova Magia</button>
      <button type="button" class="btn-clear-inventory" onclick="limparMagias()">Esquecer Todas as Magias</button>
      <button type="button" class="btn-history" onclick="abrirModalHistorico()">📜 Histórico de Conjuração</button>
    </div>

    <!-- Modal de Detalhes da Magia -->
    <div id="modal-mag" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-mag-title" style="color: #ff4444; margin: 0">Detalhes da Magia</h3>
          <button type="button" class="btn-remove-class" onclick="fecharModalMag()">×</button>
        </div>
        <div class="modal-body" id="modal-mag-body">
          <!-- Conteúdo dinâmico -->
        </div>
        <div class="modal-footer"></div>
      </div>
    </div>

    <!-- Modal de Histórico -->
    <div id="modal-historico" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 style="color: #3b82f6; margin: 0">Histórico de Conjuração</h3>
          <button type="button" class="btn-remove-class" onclick="this.closest('.modal-overlay').style.display = 'none'">×</button>
        </div>
        <div class="modal-body" id="historico-lista"></div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn-save-modal"
            style="background: #3b82f6; width: 100%"
            onclick="this.closest('.modal-overlay').style.display = 'none'"
          >
            Fechar
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
