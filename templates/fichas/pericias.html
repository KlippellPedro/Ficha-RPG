<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perícias</title>
    <link rel="stylesheet" href="../../statics/css/global.css" />
    <link rel="stylesheet" href="../../statics/css/menu.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/pericias.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/ficha_modais.css" />
    <script src="../../statics/js/fichas/classes_data.js"></script>
    <script src="../../statics/js/fichas/racas_data.js"></script>
    <script src="../../statics/js/global.js"></script>
    <script src="../../statics/js/menu.js"></script>
    <script src="../../statics/js/fichas/pericias.js"></script>
  </head>
  <body>
    <!-- Menu Superior Dinâmico -->
    <nav class="top-menu">
      <div class="menu-links">
        <!-- Gerado pelo menu.js -->
      </div>
    </nav>

    <!-- Global Notification Area -->
    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <div class="container">
      <header>
        <h1>PERÍCIAS</h1>
      </header>

      <section class="skills-section">
        <div class="skills-grid" id="skills-container">
          <!-- As perícias serão geradas dinamicamente pelo pericia.js -->
        </div>
        <button type="button" class="btn-add-skill" onclick="adicionarOficioUI()">+ Adicionar Ofício / Perícia Customizada</button>
      </section>

      <!-- Modal de Ajuda de Cálculo (Agora dentro do body e com as referências corretas) -->
      <div id="modal-calc-ajuda" class="modal-overlay" style="display: none">
        <div class="modal-content-box" style="max-width: 450px; border-color: #ff4444">
          <h2 id="modal-calc-ajuda-title" class="modal-title" style="color: #ff4444">Cálculo de Status</h2>
          <div id="modal-calc-ajuda-body" class="modal-body" style="margin-top: 15px"></div>
          <button
            type="button"
            class="btn-modal-close"
            style="width: 100%; margin-top: 20px"
            onclick="document.getElementById('modal-calc-ajuda').style.display = 'none'"
          >
            Entendi
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
