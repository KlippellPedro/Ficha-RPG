<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poderes - Supremacia do Protesto</title>
    <link rel="stylesheet" href="../../statics/css/global.css" />
    <link rel="stylesheet" href="../../statics/css/menu.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/inventario.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/habilidades.css" />
    <link rel="stylesheet" href="../../statics/css/fichas/ficha_modais.css" />
    <script src="../../statics/js/global.js"></script>
    <script src="../../statics/js/menu.js"></script>
    <script src="../../statics/js/fichas/poderes.js"></script>
  </head>
  <body>
    <nav class="top-menu">
      <div class="menu-links"></div>
    </nav>

    <!-- Global Notification Area -->
    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <div class="container">
      <header>
        <h1>PODERES</h1>
      </header>

      <div class="filter-bar">
        <div class="search-group">
          <input type="text" id="search-poder" class="inv-input" placeholder="🔍 Pesquisar poder pelo nome..." oninput="filtrarPoderes()" />
        </div>
        <select id="filter-poder-tipo" class="inv-input" style="max-width: 150px" onchange="filtrarPoderes()">
          <option value="todos">Todos os Tipos</option>
          <option value="Poder de Classe">Classe</option>
          <option value="Poder de Povo">Povo</option>
          <option value="Poder de Raça">Raça</option>
          <option value="Outro">Outro</option>
        </select>
        <button type="button" class="btn-open-desc" onclick="resetarFiltrosPoderes()" title="Limpar Filtros">🔄</button>
      </div>

      <div
        id="poderes-counter"
        style="color: #888; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; padding-left: 5px"
      >
        Poderes visíveis: 0
      </div>

      <div class="inv-header pod-header-grid">
        <span>Nome</span>
        <span>Tipo</span>
        <span>Custo</span>
        <span>Info</span>
        <span>Usar</span>
        <span>Dup</span>
        <span>X</span>
      </div>

      <section id="poderes-container" class="inventory-list">
        <!-- Injetado via JS -->
      </section>

      <button type="button" class="btn-add-card" onclick="adicionarPoderUI()">+ Novo Poder</button>
      <button type="button" class="btn-clear-inventory" onclick="limparPoderes()">Limpar Poderes</button>
    </div>

    <!-- Modal de Detalhes do Poder -->
    <div id="modal-pod" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-pod-title" style="color: #ff4444; margin: 0">Detalhes do Poder</h3>
          <button type="button" class="btn-remove-class" onclick="fecharModalPod()">×</button>
        </div>
        <div class="modal-body" id="modal-pod-body">
          <!-- Conteúdo dinâmico -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-save-modal" onclick="salvarDetalhesPod()">Salvar e Fechar</button>
        </div>
      </div>
    </div>
    <div id="modal-pod-buffs" class="modal-overlay">
      <div class="modal-content-box" style="max-width: 450px; border-color: #ff4444">
        <h2 class="modal-title" style="color: #ff4444">Configurar Buffs do Poder</h2>
        <div id="pod-buffs-container" style="margin: 20px 0; max-height: 300px; overflow-y: auto; padding-right: 10px">
          <!-- Linhas de bônus geradas via JS -->
        </div>
        <button type="button" class="btn-add-class" style="width: 100%; margin-bottom: 20px" onclick="adicionarLinhaBuffPoder()">
          + Adicionar Outro Bônus
        </button>
        <div style="display: flex; gap: 10px; justify-content: flex-end">
          <button
            type="button"
            class="btn-modal-close"
            style="width: auto; margin-top: 0; padding: 8px 20px; background: #555"
            onclick="fecharModalBuffPod()"
          >
            Cancelar
          </button>
          <button
            type="button"
            class="btn-save-modal"
            style="padding: 8px 20px; background: #ff4444; color: white; border: 1px solid #991b1b"
            onclick="salvarBuffsPoder()"
          >
            Salvar Buffs
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
