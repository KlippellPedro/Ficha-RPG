<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perícias</title>
    <link rel="stylesheet" href="../statics/css/global.css" />
    <link rel="stylesheet" href="../statics/css/global_modals.css" />
    <link rel="stylesheet" href="../statics/css/menu.css" />
    <link rel="stylesheet" href="../statics/css/pericias/pericias.css" />
    <link rel="stylesheet" href="../statics/css/responsive.css" />
    <link rel="stylesheet" href="../statics/css/pericias/pericias_responsive.css" />
    <script src="../statics/js/responsive.js"></script>
    <script src="../statics/js/ficha/classes/classes_data.js"></script>
    <script src="../statics/js/ficha/classes/class_loader.js"></script>
    <script src="../statics/js/ficha/racas/racas_data.js"></script>
    <script src="../statics/js/global.js"></script>
    <script src="../statics/js/global_calculations.js"></script>
    <script src="../statics/js/global_ui.js"></script>
    <script src="../statics/js/global_data.js"></script>
    <script src="../statics/js/global_images.js"></script>
    <script src="../statics/js/global_modals.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/pericias/pericias_data.js"></script>
    <script src="../statics/js/pericias/pericias.js"></script>
    <script src="../statics/js/pericias/modais/pericias_modais.js"></script>
  </head>
  <body>
    <!-- Menu Superior Dinâmico -->
    <nav class="top-menu">
      <div class="menu-links">
        <!-- Gerado pelo menu.js -->
      </div>
    </nav>

    <!-- Global Notification Area -->
    <div id="global-notification">
      <span class="icon"></span>
      <span class="message"></span>
    </div>

    <div class="container">
      <header>
        <h1>PERÍCIAS</h1>
      </header>

      <div class="filter-bar" style="flex-direction:column;gap:10px;">
        <div style="display:flex;gap:10px;align-items:center;width:100%;">
          <div class="search-box">
            <input type="text" id="search-pericia" class="inv-input" placeholder="🔍 Pesquisar perícia pelo nome..." oninput="filtrarPericias()" />
          </div>
          <button type="button" class="btn-clear-notas" style="margin:0;flex-shrink:0;" onclick="resetarFiltrosPericias()">Limpar</button>
        </div>
        <div class="attr-filter-bar">
          <span class="attr-filter-label">Atributo:</span>
          <button class="btn-attr-filter active" data-attr="todos"         onclick="filtrarPericiasPorAttr(this)">Todos</button>
          <button class="btn-attr-filter"         data-attr="forca"        onclick="filtrarPericiasPorAttr(this)">FOR</button>
          <button class="btn-attr-filter"         data-attr="destreza"     onclick="filtrarPericiasPorAttr(this)">DES</button>
          <button class="btn-attr-filter"         data-attr="constituicao" onclick="filtrarPericiasPorAttr(this)">CON</button>
          <button class="btn-attr-filter"         data-attr="inteligencia" onclick="filtrarPericiasPorAttr(this)">INT</button>
          <button class="btn-attr-filter"         data-attr="sabedoria"    onclick="filtrarPericiasPorAttr(this)">SAB</button>
          <button class="btn-attr-filter"         data-attr="carisma"      onclick="filtrarPericiasPorAttr(this)">CAR</button>
          <button class="btn-attr-filter"         data-attr="aura"         onclick="filtrarPericiasPorAttr(this)">AUR</button>
        </div>
      </div>

      <section class="skills-section">
        <div class="skills-grid" id="skills-container">
          <!-- As perícias serão geradas dinamicamente pelo pericia.js -->
        </div>
        <button type="button" class="btn-add-skill" onclick="adicionarOficioUI()">+ Adicionar Ofício / Perícia Customizada</button>
      </section>
    </div>
  </body>
</html>
